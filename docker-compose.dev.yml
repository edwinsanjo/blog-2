services:
  blog-dev:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ${VAULT_PATH}:/app/vault
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"

# To Run: docker compose -f docker-compose.dev.yml up
