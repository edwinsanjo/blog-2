services:
  blog:
    build: .
    ports:
      - "5008:3000"
    volumes:
      - ${VAULT_PATH}:/app/vault
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
